name: Linux test build

# Builds the Linux .deb and .rpm without making a release, for trying them out. Run it from the
# Actions tab ("Run workflow") or with `gh workflow run linux-build.yml`, then download the
# packages from the run's Artifacts section.
on:
  workflow_dispatch:

jobs:
  linux-packages:
    # Same as the release: the oldest supported Ubuntu, so the binary runs on more distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build .deb and .rpm
        run: bun run tauri build --bundles deb,rpm

      - uses: actions/upload-artifact@v4
        with:
          name: lontar-linux-packages
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
