name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Set up signing key
        working-directory: src-tauri/gen/android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyAlias=lontar"
          } > keystore.properties

      - name: Build APK
        run: bun run tauri android build --apk

      - name: Rename APK
        run: |
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
             "lontar-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: lontar-${{ github.ref_name }}.apk

  macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Without these secrets the app stays ad-hoc signed (bundle.macOS.signingIdentity "-"),
      # and users have to approve it in System Settings > Privacy & Security on first launch.
      - name: Enable Developer ID signing and notarization
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then echo "No Apple signing secrets; DMG stays ad-hoc signed."; exit 0; fi
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            echo "$v<<__EOF__" >> "$GITHUB_ENV"
            printenv "$v" >> "$GITHUB_ENV"
            echo "__EOF__" >> "$GITHUB_ENV"
          done

      - name: Build DMG
        run: bun run tauri build --target universal-apple-darwin --bundles dmg

      - name: Collect DMG
        run: |
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg \
             "lontar-${GITHUB_REF_NAME}-macos-universal.dmg"

      - uses: softprops/action-gh-release@v2
        with:
          files: lontar-${{ github.ref_name }}-macos-universal.dmg

  ios-ipa:
    # Unsigned .ipa for sideloading (AltStore / SideStore / Sideloadly re-sign it with the user's Apple ID).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
          # swift-rs needs llvm-objcopy to re-export Swift symbols on Xcode 27 (tauri-apps/tauri#16130)
          components: llvm-tools

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build unsigned IPA
        run: bun run tauri ios build --target aarch64 --no-sign

      - name: Collect IPA
        run: cp src-tauri/gen/apple/build/arm64/lontar.ipa "lontar-${GITHUB_REF_NAME}-ios-unsigned.ipa"

      - uses: softprops/action-gh-release@v2
        with:
          files: lontar-${{ github.ref_name }}-ios-unsigned.ipa

  linux-deb:
    # Oldest supported Ubuntu, so the binary links against an old glibc and runs on more distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build .deb
        run: bun run tauri build --bundles deb

      - name: Collect .deb
        run: cp src-tauri/target/release/bundle/deb/*.deb "lontar-${GITHUB_REF_NAME}-amd64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: lontar-${{ github.ref_name }}-amd64.deb

      - uses: softprops/action-gh-release@v2
        with:
          files: lontar-${{ github.ref_name }}-amd64.deb

  flatpak:
    needs: linux-deb
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: deb

      - name: Stage .deb for the manifest
        run: mv lontar-*.deb flatpak/lontar.deb

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: lontar-${{ github.ref_name }}-x86_64.flatpak
          manifest-path: flatpak/com.nawa.lontar.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - uses: softprops/action-gh-release@v2
        with:
          files: lontar-${{ github.ref_name }}-x86_64.flatpak
