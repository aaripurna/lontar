name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use the tag as the app version
        shell: bash
        run: node scripts/set-version.mjs "$GITHUB_REF_NAME"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Set up signing key
        working-directory: src-tauri/gen/android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyAlias=lontar"
          } > keystore.properties

      - name: Build APK
        run: bun run tauri android build --apk

      - name: Rename APK
        run: |
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
             "lontar-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: lontar-${{ github.ref_name }}.apk

  macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use the tag as the app version
        shell: bash
        run: node scripts/set-version.mjs "$GITHUB_REF_NAME"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Without these secrets the app stays ad-hoc signed (bundle.macOS.signingIdentity "-"),
      # and users have to approve it in System Settings > Privacy & Security on first launch.
      - name: Enable Developer ID signing and notarization
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then echo "No Apple signing secrets; DMG stays ad-hoc signed."; exit 0; fi
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            echo "$v<<__EOF__" >> "$GITHUB_ENV"
            printenv "$v" >> "$GITHUB_ENV"
            echo "__EOF__" >> "$GITHUB_ENV"
          done

      # With the updater key, the build also makes Lontar.app.tar.gz and its signature, which
      # the installed app downloads and checks when it updates itself.
      - name: Build DMG
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            bun run tauri build --target universal-apple-darwin --bundles app,dmg \
              --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "No updater key; the DMG is built without an update package."
            bun run tauri build --target universal-apple-darwin --bundles dmg
          fi

      - name: Collect DMG
        run: |
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          cp $bundle/dmg/*.dmg "lontar-${GITHUB_REF_NAME}-macos-universal.dmg"
          if [ -f $bundle/macos/Lontar.app.tar.gz.sig ]; then
            cp $bundle/macos/Lontar.app.tar.gz "lontar-${GITHUB_REF_NAME}-macos-universal.app.tar.gz"
            mkdir -p updater && cp $bundle/macos/Lontar.app.tar.gz.sig updater/macos.sig
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: updater-macos
          path: updater/
          if-no-files-found: ignore

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            lontar-${{ github.ref_name }}-macos-universal.dmg
            lontar-${{ github.ref_name }}-macos-universal.app.tar.gz

  windows-installer:
    # Unsigned NSIS setup .exe. It installs per user (no admin needed) and fetches WebView2 if
    # it's missing. Without a code-signing certificate SmartScreen warns on first run.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use the tag as the app version
        shell: bash
        run: node scripts/set-version.mjs "$GITHUB_REF_NAME"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # With the updater key, the build also signs the installer, which the installed app checks
      # before running it to update itself.
      - name: Build installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            bun run tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "No updater key; the installer is built without an update signature."
            bun run tauri build --bundles nsis
          fi

      - name: Collect installer
        shell: bash
        run: |
          nsis=src-tauri/target/release/bundle/nsis
          cp $nsis/*-setup.exe "lontar-${GITHUB_REF_NAME}-windows-x64-setup.exe"
          if ls $nsis/*-setup.exe.sig > /dev/null 2>&1; then
            mkdir -p updater && cp $nsis/*-setup.exe.sig updater/windows.sig
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: updater-windows
          path: updater/
          if-no-files-found: ignore

      - uses: softprops/action-gh-release@v2
        with:
          files: lontar-${{ github.ref_name }}-windows-x64-setup.exe

  ios-ipa:
    # Unsigned .ipa for sideloading (AltStore / SideStore / Sideloadly re-sign it with the user's Apple ID).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use the tag as the app version
        shell: bash
        run: node scripts/set-version.mjs "$GITHUB_REF_NAME"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
          # swift-rs needs llvm-objcopy to re-export Swift symbols on Xcode 27 (tauri-apps/tauri#16130)
          components: llvm-tools

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build unsigned IPA
        run: bun run tauri ios build --target aarch64 --no-sign

      - name: Collect IPA
        run: cp src-tauri/gen/apple/build/arm64/lontar.ipa "lontar-${GITHUB_REF_NAME}-ios-unsigned.ipa"

      - uses: softprops/action-gh-release@v2
        with:
          files: lontar-${{ github.ref_name }}-ios-unsigned.ipa

  linux:
    # Oldest supported Ubuntu, so the binary links against an old glibc and runs on more distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Use the tag as the app version
        shell: bash
        run: node scripts/set-version.mjs "$GITHUB_REF_NAME"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # The .deb carries the app store metadata that Flathub shows, with this release in it.
      - name: Add the release to the app store metadata
        run: |
          sed -i "s|<release version=\"[^\"]*\" date=\"[^\"]*\"|<release version=\"${GITHUB_REF_NAME#v}\" date=\"$(date -u +%F)\"|" \
            flatpak/io.github.aaripurna.Lontar.metainfo.xml
          grep '<release ' flatpak/io.github.aaripurna.Lontar.metainfo.xml

      - name: Build .deb and .rpm
        run: bun run tauri build --bundles deb,rpm

      - name: Collect packages
        run: |
          cp src-tauri/target/release/bundle/deb/*.deb "lontar-${GITHUB_REF_NAME}-amd64.deb"
          cp src-tauri/target/release/bundle/rpm/*.rpm "lontar-${GITHUB_REF_NAME}-x86_64.rpm"

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: lontar-${{ github.ref_name }}-amd64.deb

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            lontar-${{ github.ref_name }}-amd64.deb
            lontar-${{ github.ref_name }}-x86_64.rpm

  flatpak:
    needs: linux
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: deb

      - name: Stage .deb for the manifest
        run: mv lontar-*.deb flatpak/lontar.deb

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: lontar-${{ github.ref_name }}-x86_64.flatpak
          manifest-path: flatpak/io.github.aaripurna.Lontar.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - uses: softprops/action-gh-release@v2
        with:
          files: lontar-${{ github.ref_name }}-x86_64.flatpak

  updater:
    # latest.json, which the Windows and macOS apps check for a new version (src/lib/updates.js).
    needs: [macos-dmg, windows-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        # Missing when the updater key isn't set up; the next step then skips.
        continue-on-error: true
        with:
          pattern: updater-*
          merge-multiple: true
          path: updater

      - name: Write latest.json
        run: |
          if [ ! -f updater/macos.sig ] || [ ! -f updater/windows.sig ]; then
            echo "No update signatures (TAURI_SIGNING_PRIVATE_KEY isn't set); no latest.json."
            exit 0
          fi
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          jq -n \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg date "$(date -u +%FT%TZ)" \
            --arg mac_sig "$(cat updater/macos.sig)" \
            --arg mac_url "$base/lontar-${GITHUB_REF_NAME}-macos-universal.app.tar.gz" \
            --arg win_sig "$(cat updater/windows.sig)" \
            --arg win_url "$base/lontar-${GITHUB_REF_NAME}-windows-x64-setup.exe" \
            '{version: $version, pub_date: $date, platforms: {
              "darwin-aarch64": {signature: $mac_sig, url: $mac_url},
              "darwin-x86_64": {signature: $mac_sig, url: $mac_url},
              "windows-x86_64": {signature: $win_sig, url: $win_url}
            }}' > latest.json
          cat latest.json

      - uses: softprops/action-gh-release@v2
        with:
          files: latest.json
