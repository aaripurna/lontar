name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Set up signing key
        working-directory: src-tauri/gen/android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyAlias=lontar"
          } > keystore.properties

      - name: Build APK
        run: bun run tauri android build --apk

      - name: Rename APK
        run: |
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
             "lontar-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: lontar-${{ github.ref_name }}.apk

  linux-deb:
    # Oldest supported Ubuntu, so the binary links against an old glibc and runs on more distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build .deb
        run: bun run tauri build --bundles deb

      - name: Collect .deb
        run: cp src-tauri/target/release/bundle/deb/*.deb "lontar-${GITHUB_REF_NAME}-amd64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: lontar-${{ github.ref_name }}-amd64.deb

      - uses: softprops/action-gh-release@v2
        with:
          files: lontar-${{ github.ref_name }}-amd64.deb

  flatpak:
    needs: linux-deb
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: deb

      - name: Stage .deb for the manifest
        run: mv lontar-*.deb flatpak/lontar.deb

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: lontar-${{ github.ref_name }}-x86_64.flatpak
          manifest-path: flatpak/com.nawa.lontar.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - uses: softprops/action-gh-release@v2
        with:
          files: lontar-${{ github.ref_name }}-x86_64.flatpak
