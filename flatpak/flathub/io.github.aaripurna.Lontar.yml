# The manifest submitted to Flathub (github.com/flathub/flathub, then its own repo once
# accepted). It repackages the .deb attached to a GitHub release; Flathub's update checker
# (x-checker-data) opens a pull request with the new url and sha256 for each release.
# The build-commands match ../io.github.aaripurna.Lontar.yml.
id: io.github.aaripurna.Lontar
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: lontar
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
modules:
  - name: lontar
    buildsystem: simple
    sources:
      - type: file
        dest-filename: lontar.deb
        url: https://github.com/aaripurna/lontar/releases/download/v1.0.4/lontar-v1.0.4-amd64.deb
        sha256: 29f642783e09d8608c88c5e1ff3b4975a1d5fc63b4ffceff39daf61aafbb8ca9
        x-checker-data:
          type: json
          url: https://api.github.com/repos/aaripurna/lontar/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | endswith("-amd64.deb")) | .browser_download_url
    build-commands:
      - ar -x lontar.deb
      - tar -xf data.tar.*
      - install -Dm755 usr/bin/lontar /app/bin/lontar
      - desktop-file-edit --set-icon=$FLATPAK_ID usr/share/applications/Lontar.desktop
      - install -Dm644 usr/share/applications/Lontar.desktop /app/share/applications/$FLATPAK_ID.desktop
      - |
        for size in 32x32 128x128 256x256@2; do
          install -Dm644 usr/share/icons/hicolor/$size/apps/lontar.png /app/share/icons/hicolor/$size/apps/$FLATPAK_ID.png
        done
      - install -Dm644 usr/share/metainfo/$FLATPAK_ID.metainfo.xml /app/share/metainfo/$FLATPAK_ID.metainfo.xml
