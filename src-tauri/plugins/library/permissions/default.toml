[default]
description = "Allows picking library folders, scanning them for ebooks, opening books, and reading and writing each book's .lontar sidecar, and colouring the system bars."
permissions = [
  "allow-pick-folder",
  "allow-release-folder",
  "allow-scan",
  "allow-read-book",
  "allow-read-sidecar",
  "allow-write-sidecar",
  "allow-read-sidecar-conflicts",
  "allow-delete-sidecar-conflict",
  "allow-set-bar-colors",
]
