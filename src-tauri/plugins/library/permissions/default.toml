[default]
description = "Allows picking library folders, scanning them for ebooks, opening books, and reading, writing and moving each book's .lontar sidecar, colouring the system bars, and receiving books opened from the OS."
permissions = [
  "allow-pick-folder",
  "allow-release-folder",
  "allow-scan",
  "allow-read-book",
  "allow-read-sidecar",
  "allow-write-sidecar",
  "allow-read-sidecar-conflicts",
  "allow-delete-sidecar-conflict",
  "allow-delete-sidecar",
  "allow-set-bar-colors",
  "allow-take-opened-books",
  "allow-move-to-background",
]
